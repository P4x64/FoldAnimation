name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/foldanimation

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldAnimation"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldanimation"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldanimation"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="FoldAnimation"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/MainActivity.kt
          package com.example.foldanimation

          import android.app.Activity
          import android.content.Context
          import android.graphics.RenderEffect
          import android.graphics.Shader
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.ImageView
          import android.widget.TextView

          class MainActivity : Activity(), SensorEventListener {

              private lateinit var sensorManager: SensorManager
              private var hingeSensor: Sensor? = null
              private lateinit var targetImage: ImageView
              private lateinit var angleText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = android.widget.FrameLayout(this)
                  targetImage = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setImageResource(android.R.drawable.sym_def_app_icon)
                  }
                  angleText = TextView(this).apply {
                      textSize = 20f
                      setTextColor(0xFFFFFFFF.toInt())
                      setPadding(50, 100, 0, 0)
                  }
                  layout.addView(targetImage)
                  layout.addView(angleText)
                  setContentView(layout)

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hingeSensor = sensorManager.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)
              }

              override fun onResume() {
                  super.onResume()
                  hingeSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  event?.let {
                      val angle = it.values[0]
                      angleText.text = "转轴开合角度: ${angle.toInt()}°"
                      updateBlur(angle)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun updateBlur(angle: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return
                  val startAngle = 120f
                  val finishAngle = 175f
                  val progress = ((angle - startAngle) / (finishAngle - startAngle)).coerceIn(0f, 1f)
                  val maxBlur = 75f
                  val currentBlur = (1f - progress) * maxBlur

                  if (currentBlur > 1f) {
                      val blurEffect = RenderEffect.createBlurEffect(currentBlur, currentBlur, Shader.TileMode.CLAMP)
                      targetImage.setRenderEffect(blurEffect)
                  } else {
                      targetImage.setRenderEffect(null)
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldAnimation-Debug
          path: app/build/outputs/apk/debug/*.apk
