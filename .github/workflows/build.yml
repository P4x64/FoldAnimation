name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Deep Optical Engine Source
        run: |
          mkdir -p app/src/main/java/com/example/foldanimation

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldAnimation"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldanimation"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldanimation"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 10
                  versionName = "8.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fold 8"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:resizeableActivity="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/MainActivity.kt
          package com.example.foldanimation

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Choreographer
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.abs

          data class RealAppItem(val label: String, val icon: Drawable, val pkg: String)

          class MainActivity : Activity(), SensorEventListener, Choreographer.FrameCallback {

              private lateinit var sm: SensorManager
              private var hinge: Sensor? = null
              private lateinit var root: FrameLayout
              
              private var leftPanel: LinearLayout? = null
              private var rightPanel: LinearLayout? = null
              private var outerLayer: LinearLayout? = null
              private var creaseShadowView: View? = null
              private var dockBarView: View? = null

              private val myApps = mutableListOf<RealAppItem>()
              private var isUnfolded = false

              // 物理插值状态：目标角度与当前平滑阻尼角度
              private var rawTargetAngle = 180f
              private var smoothedAngle = 180f
              private var lastAppliedBlurRadius = -1f

              private fun dp(v: Float): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setupImmersiveCutout()

                  sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hinge = sm.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)

                  root = FrameLayout(this)
                  setContentView(root)

                  loadDeviceRealApps()
                  checkScreen(resources.configuration)
                  rebuildDesktopUI()
              }

              override fun onResume() {
                  super.onResume()
                  setupImmersiveCutout()
                  hinge?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST) }
                  Choreographer.getInstance().postFrameCallback(this)
              }

              override fun onPause() {
                  super.onPause()
                  sm.unregisterListener(this)
                  Choreographer.getInstance().removeFrameCallback(this)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  setupImmersiveCutout()
                  checkScreen(newConfig)
                  rebuildDesktopUI()
                  lastAppliedBlurRadius = -1f
              }

              private fun checkScreen(c: Configuration) {
                  isUnfolded = c.smallestScreenWidthDp >= 600
              }

              private fun setupImmersiveCutout() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  window.setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
                  window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_FULLSCREEN
                                  or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          )
              }

              private fun loadDeviceRealApps() {
                  myApps.clear()
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val list: List<ResolveInfo> = pm.queryIntentActivities(mainIntent, 0)
                  for (info in list) {
                      if (info.activityInfo.packageName == packageName) continue
                      val name = info.loadLabel(pm).toString()
                      val icon = info.loadIcon(pm)
                      myApps.add(RealAppItem(name, icon, info.activityInfo.packageName))
                  }
              }

              override fun onSensorChanged(e: SensorEvent?) {
                  e?.let {
                      rawTargetAngle = it.values[0]
                  }
              }

              override fun onAccuracyChanged(s: Sensor?, a: Int) {}

              // === 核心：120Hz 渲染管线帧循环，彻底消除跳动与卡顿 ===
              override fun doFrame(frameTimeNanos: Long) {
                  // 阻尼滤波插值（指数滑动平均，实现跟手但极其平滑的物理质感）
                  val lerpFactor = 0.22f
                  smoothedAngle += (rawTargetAngle - smoothedAngle) * lerpFactor

                  applyDeepOpticalTransition(smoothedAngle)

                  Choreographer.getInstance().postFrameCallback(this)
              }

              // === 深度复刻视频 2：三次光学拉焦 + 中轴锚定扇形缩放 + 中缝立体阴影 ===
              private fun applyDeepOpticalTransition(angle: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return

                  if (isUnfolded) {
                      // 展开过渡区间：105° 到 176°
                      val rawProgress = ((angle - 105f) / (176f - 105f)).coerceIn(0f, 1f)
                      // 三次埃尔米特（Hermite Smoothstep）曲线：真实镜头的拉焦非线性曲线
                      val smoothProgress = rawProgress * rawProgress * (3f - 2f * rawProgress)
                      val focusFactor = smoothProgress

                      // 1. 光学景深散景半径计算（高斯核动态退火）
                      val targetBlur = if (angle >= 175f) 0f else (1f - focusFactor) * 95f

                      leftPanel?.let { panel ->
                          // 2. 关键：中轴转轴锚定（Pivot 锁定在转轴右边缘）
                          panel.pivotX = panel.width.toFloat()
                          panel.pivotY = panel.height * 0.5f

                          // 3. 扇形开合视差缩放（水平横向延展 + 垂直微放）
                          val scaleX = 0.86f + (0.14f * focusFactor)
                          val scaleY = 0.90f + (0.10f * focusFactor)
                          panel.scaleX = scaleX
                          panel.scaleY = scaleY

                          // 4. 水平视差位移与光影明暗
                          panel.translationX = (1f - focusFactor) * -dp(36f)
                          panel.alpha = 0.60f + (0.40f * focusFactor)

                          // 5. 硬件模糊着色器（带阈值过滤，避免频繁分配 Skia 句柄）
                          if (abs(targetBlur - lastAppliedBlurRadius) > 1.0f) {
                              lastAppliedBlurRadius = targetBlur
                              if (targetBlur > 1.5f) {
                                  panel.setRenderEffect(RenderEffect.createBlurEffect(targetBlur, targetBlur, Shader.TileMode.CLAMP))
                              } else {
                                  panel.setRenderEffect(null)
                              }
                          }
                      }

                      // 6. 中缝物理折痕深度阴影（开合时立体加深，摆平时完全隐退）
                      creaseShadowView?.let { shadow ->
                          val shadowAlpha = (1f - focusFactor) * 0.55f
                          shadow.alpha = shadowAlpha
                      }

                      // 7. 底部悬浮 Dock 栏微动效展开
                      dockBarView?.let { dock ->
                          dock.scaleX = 0.88f + (0.12f * focusFactor)
                          dock.alpha = 0.65f + (0.35f * focusFactor)
                      }

                      // 右侧视觉重心面板始终保持锐利
                      rightPanel?.setRenderEffect(null)

                  } else {
                      // 外屏模式：开屏中动态失焦，合紧至 0° 的刹那触发弹簧合焦
                      val progress = ((angle - 3f) / (32f - 3f)).coerceIn(0f, 1f)
                      val smoothProgress = progress * progress * (3f - 2f * progress)
                      val blurRadius = smoothProgress * 80f

                      outerLayer?.let { layer ->
                          if (angle <= 2f) {
                              // 合紧扣合的瞬间（0° 吸附弹簧效果）
                              layer.scaleX = 1.0f
                              layer.scaleY = 1.0f
                              layer.setRenderEffect(null)
                          } else {
                              layer.scaleX = 1.0f - (0.05f * smoothProgress)
                              layer.scaleY = 1.0f - (0.05f * smoothProgress)
                              if (blurRadius > 1.5f) {
                                  layer.setRenderEffect(RenderEffect.createBlurEffect(blurRadius, blurRadius, Shader.TileMode.CLAMP))
                              } else {
                                  layer.setRenderEffect(null)
                              }
                          }
                      }
                  }
              }

              private fun rebuildDesktopUI() {
                  root.removeAllViews()

                  // 1. 底层壁纸：自动获取你当前手机设置的真实壁纸
                  val wallpaper = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      try {
                          val wm = WallpaperManager.getInstance(this@MainActivity)
                          setImageDrawable(wm.drawable)
                      } catch (e: Throwable) {
                          setBackgroundColor(0xFF1E222A.toInt())
                      }
                  }
                  root.addView(wallpaper)

                  // 2. 桌面主体
                  if (isUnfolded) {
                      buildInner()
                  } else {
                      buildOuter()
                  }

                  // 3. 顶部微型状态栏（真实时间与电量）
                  addRealStatusBar()
              }

              private fun buildInner() {
                  val hBox = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(22f), dp(44f), dp(22f), dp(85f))
                  }

                  // === 左扇面（挂载物理合焦引擎） ===
                  leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply {
                          marginEnd = dp(16f)
                      }

                      val topWidgets = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createWeatherWidget())
                      }
                      addView(topWidgets)

                      // 展示你手机的前 8 个真实应用
                      addView(createRealAppGrid(4, 0, 8))

                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                  }

                  // === 右侧锚点（保持清晰锐利） ===
                  rightPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply {
                          marginStart = dp(16f)
                      }

                      val topRow = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          val subBox = LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.HORIZONTAL
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f)
                              if (myApps.size > 8) addView(createAppView(myApps[8]))
                              if (myApps.size > 9) addView(createAppView(myApps[9]))
                          }
                          addView(subBox)
                          addView(createStatusWidget())
                      }
                      addView(topRow)

                      // 展示后续的真实应用
                      if (myApps.size > 10) {
                          addView(createRealAppGrid(4, 10, 8))
                      }

                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                  }

                  hBox.addView(leftPanel)
                  hBox.addView(rightPanel)
                  root.addView(hBox)

                  // 4. 中缝物理折痕深度立体阴影层（随开合动态淡入淡出）
                  creaseShadowView = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(dp(50f), FrameLayout.LayoutParams.MATCH_PARENT).apply {
                          gravity = Gravity.CENTER
                      }
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(0x00000000, 0x88000000.toInt(), 0x00000000)
                      )
                      alpha = 0f
                  }
                  root.addView(creaseShadowView)

                  // 5. 底部悬浮毛玻璃 Dock 栏
                  val dockWrap = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                          bottomMargin = dp(18f)
                      }
                  }
                  dockBarView = createDockBar(6)
                  dockWrap.addView(dockBarView)
                  root.addView(dockWrap)
              }

              private fun buildOuter() {
                  outerLayer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(18f), dp(44f), dp(18f), dp(20f))

                      val topWidgets = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createWeatherWidget())
                      }
                      addView(topWidgets)

                      addView(createRealAppGrid(4, 0, 8))
                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                      addView(createDockBar(4))
                  }
                  root.addView(outerLayer)
              }

              private fun createRealAppGrid(cols: Int, startIndex: Int, count: Int): View {
                  val grid = GridLayout(this).apply {
                      columnCount = cols
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(18f)
                      }
                  }

                  val maxEnd = minOf(startIndex + count, myApps.size)
                  for (i in startIndex until maxEnd) {
                      val app = myApps[i]
                      val appView = createAppView(app)
                      appView.layoutParams = GridLayout.LayoutParams().apply {
                          width = 0
                          columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                          bottomMargin = dp(16f)
                      }
                      grid.addView(appView)
                  }
                  return grid
              }

              private fun createAppView(app: RealAppItem): View {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setOnClickListener {
                          animate().scaleX(0.88f).scaleY(0.88f).setDuration(80).withEndAction {
                              animate().scaleX(1.0f).scaleY(1.0f).setDuration(100).start()
                              val launchIntent = packageManager.getLaunchIntentForPackage(app.pkg)
                              launchIntent?.let { startActivity(it) }
                          }.start()
                      }
                  }

                  val iconImg = ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(54f), dp(54f))
                      setImageDrawable(app.icon)
                  }

                  val nameTv = TextView(this).apply {
                      text = app.label
                      textSize = 11f
                      setTextColor(0xEEFFFFFF.toInt())
                      maxLines = 1
                      setPadding(0, dp(4f), 0, 0)
                  }

                  layout.addView(iconImg)
                  layout.addView(nameTv)
                  return layout
              }

              private fun createDockBar(count: Int): View {
                  val dockWrap = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          if (isUnfolded) dp(330f) else LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(68f)
                      )
                      background = GradientDrawable().apply {
                          cornerRadius = dp(34f).toFloat()
                          setColor(0x40FFFFFF.toInt())
                      }
                  }

                  val dockApps = myApps.take(count)
                  for (app in dockApps) {
                      val icon = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(48f), dp(48f)).apply {
                              leftMargin = dp(8f)
                              rightMargin = dp(8f)
                          }
                          setImageDrawable(app.icon)
                          setOnClickListener {
                              animate().scaleX(0.88f).scaleY(0.88f).setDuration(80).withEndAction {
                                  animate().scaleX(1.0f).scaleY(1.0f).setDuration(100).start()
                                  val launchIntent = packageManager.getLaunchIntentForPackage(app.pkg)
                                  launchIntent?.let { startActivity(it) }
                              }.start()
                          }
                      }
                      dockWrap.addView(icon)
                  }
                  return dockWrap
              }

              private fun addRealStatusBar() {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(12f)
                          leftMargin = dp(24f)
                          rightMargin = dp(24f)
                      }
                  }
                  val timeTv = TextView(this).apply {
                      text = SimpleDateFormat("H:mm", Locale.getDefault()).format(Date())
                      textSize = 13f
                      setTextColor(0xDDFFFFFF.toInt())
                      paint.isFakeBoldText = true
                  }
                  val spacer = View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1.0f) }
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val battery = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val rightInfo = TextView(this).apply {
                      text = "5G  $battery%"
                      textSize = 13f
                      setTextColor(0xDDFFFFFF.toInt())
                      paint.isFakeBoldText = true
                  }
                  bar.addView(timeTv)
                  bar.addView(spacer)
                  bar.addView(rightInfo)
                  root.addView(bar)
              }

              private fun createBriefWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginEnd = dp(8f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC102434.toInt()) }
                  }
                  val bar = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(6f), dp(14f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply { cornerRadius = dp(3f).toFloat(); setColor(0xFF00E5FF.toInt()) }
                  }
                  val t = TextView(this).apply { text = "Now brief"; textSize = 15f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                  val s = TextView(this).apply { text = "Get today's highlights"; textSize = 11f; setTextColor(0x99FFFFFF.toInt()) }
                  card.addView(bar)
                  card.addView(t)
                  card.addView(s)
                  return card
              }

              private fun createWeatherWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginStart = dp(8f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC163B5C.toInt()) }
                  }
                  val dot = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(10f), dp(10f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFFFFCA28.toInt()) }
                  }
                  val t = TextView(this).apply { text = SimpleDateFormat("EEE, d MMM", Locale.ENGLISH).format(Date()); textSize = 15f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                  val s = TextView(this).apply { text = "Sunny"; textSize = 11f; setTextColor(0xAAFFFFFF.toInt()) }
                  card.addView(dot)
                  card.addView(t)
                  card.addView(s)
                  return card
              }

              private fun createStatusWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginStart = dp(10f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC1E242C.toInt()) }
                  }
                  val dot = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(10f), dp(10f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFFBA68C8.toInt()) }
                  }
                  val t = TextView(this).apply { text = "Status"; textSize = 15f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                  val s = TextView(this).apply { text = "All systems normal"; textSize = 11f; setTextColor(0x99FFFFFF.toInt()) }
                  card.addView(dot)
                  card.addView(t)
                  card.addView(s)
                  return card
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found!" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fold8-DeepOptical-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
