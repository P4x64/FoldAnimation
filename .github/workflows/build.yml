name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/foldanimation

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldAnimation"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldanimation"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldanimation"
                  minSdk = 31
                  targetSdk = 33
                  versionCode = 2
                  versionName = "1.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fold展开动画"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FoldBlurService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/MainActivity.kt
          package com.example.foldanimation

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                  }

                  val info = TextView(this).apply {
                      text = "【Fold 动画服务】\n\n1. 授予悬浮窗权限\n2. 点击启动后返回桌面\n3. 观察右上角是否有角度数值跳动"
                      textSize = 16f
                      setPadding(0, 0, 0, 40)
                  }

                  val startBtn = Button(this).apply {
                      text = "启动服务"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                              return@setOnClickListener
                          }
                          val serviceIntent = Intent(this@MainActivity, FoldBlurService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          Toast.makeText(this@MainActivity, "服务已启动，按Home回桌面查看", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val stopBtn = Button(this).apply {
                      text = "停止服务"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, FoldBlurService::class.java))
                          Toast.makeText(this@MainActivity, "服务已停止", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(info)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/FoldBlurService.kt
          package com.example.foldanimation

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView

          class FoldBlurService : Service(), SensorEventListener {

              private lateinit var windowManager: WindowManager
              private var containerView: FrameLayout? = null
              private lateinit var debugText: TextView
              private lateinit var layoutParams: WindowManager.LayoutParams
              private lateinit var sensorManager: SensorManager
              private var hingeSensor: Sensor? = null
              private var isBlurSupported = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hingeSensor = sensorManager.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      isBlurSupported = windowManager.isCrossWindowBlurEnabled
                  }

                  initOverlay()

                  hingeSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST)
                  }
              }

              private fun initOverlay() {
                  containerView = FrameLayout(this).apply {
                      // 关键修复：必须具备极浅的底色以强制 GPU 分配渲染 Surface
                      setBackgroundColor(Color.argb(1, 0, 0, 0))
                  }

                  debugText = TextView(this).apply {
                      textSize = 12f
                      setTextColor(Color.YELLOW)
                      setBackgroundColor(Color.argb(160, 0, 0, 0))
                      setPadding(20, 10, 20, 10)
                      val sensorStatus = if (hingeSensor != null) "正常" else "未找到"
                      val blurStatus = if (isBlurSupported) "支持" else "未开启/不支持"
                      text = "角度: 等待中 | 传感器: $sensorStatus | 系统模糊: $blurStatus"
                  }

                  val textParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      topMargin = 120
                      rightMargin = 40
                  }
                  containerView?.addView(debugText, textParams)

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                  }

                  layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      type,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      layoutParams.blurBehindRadius = 0
                  }

                  windowManager.addView(containerView, layoutParams)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  event?.let {
                      val angle = it.values[0]
                      val blurStatus = if (isBlurSupported) "支持" else "未开启"
                      debugText.text = "角度: ${angle.toInt()}° | 系统模糊: $blurStatus"
                      applyEffectByAngle(angle)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun applyEffectByAngle(angle: Float) {
                  // 过渡范围：120° 到 172° 之间进行景深展开
                  val progress = ((angle - 120f) / (172f - 120f)).coerceIn(0f, 1f)
                  val blurFactor = 1f - progress

                  if (isBlurSupported && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val maxBlur = 80
                      val targetRadius = if (angle >= 175f) 0 else (blurFactor * maxBlur).toInt()
                      if (layoutParams.blurBehindRadius != targetRadius) {
                          layoutParams.blurBehindRadius = targetRadius
                          containerView?.let { windowManager.updateViewLayout(it, layoutParams) }
                      }
                  } else {
                      // 降级方案：如果系统强行禁用了跨窗口模糊，使用半透明磨砂遮罩动态弥补视觉变化
                      val alpha = (blurFactor * 120).toInt()
                      containerView?.setBackgroundColor(Color.argb(alpha, 255, 255, 255))
                  }
              }

              private fun startAsForeground() {
                  val channelId = "fold_service"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Fold Service", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("Fold 展开服务运行中")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build()
                  } else {
                      Notification.Builder(this)
                          .setContentTitle("Fold 展开服务运行中")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build()
                  }
                  startForeground(1002, notification)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sensorManager.unregisterListener(this)
                  containerView?.let { windowManager.removeView(it) }
              }
          }
          EOF

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldAnimation-Debug
          path: app/build/outputs/apk/debug/*.apk
