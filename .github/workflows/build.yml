name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate High-Fidelity Fold Demo
        run: |
          mkdir -p app/src/main/java/com/example/foldanimation

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldAnimation"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldanimation"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldanimation"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 3
                  versionName = "2.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fold8 Concept"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/MainActivity.kt
          package com.example.foldanimation

          import android.app.Activity
          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.*

          class MainActivity : Activity(), SensorEventListener {

              private lateinit var sensorManager: SensorManager
              private var hingeSensor: Sensor? = null
              private lateinit var rootContainer: FrameLayout
              private lateinit var contentLayer: LinearLayout
              private var isUnfolded = false
              private var currentAngle = 180f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // 隐藏一切系统条，做到 100% 真实全屏伪装
                  hideSystemUI()

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hingeSensor = sensorManager.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)

                  rootContainer = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }
                  setContentView(rootContainer)

                  checkScreenState(resources.configuration)
                  buildDesktopUI()
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemUI()
                  hingeSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideSystemUI()
                  checkScreenState(newConfig)
                  buildDesktopUI()
                  applyBlurEffect(currentAngle)
              }

              private fun checkScreenState(config: Configuration) {
                  // 折叠屏展开宽度通常大于 600dp
                  isUnfolded = config.smallestScreenWidthDp >= 600
              }

              private fun hideSystemUI() {
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_FULLSCREEN
                                  or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          )
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  event?.let {
                      currentAngle = it.values[0]
                      applyBlurEffect(currentAngle)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              // 物理开合景深过渡计算（完全复刻视频2的动态曲线）
              private fun applyBlurEffect(angle: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return

                  val blurRadius: Float
                  val scaleFactor: Float

                  if (isUnfolded) {
                      // 内屏展开阶段：110°~175° 从失焦虚化过渡到晶莹剔透的合焦
                      val progress = ((angle - 115f) / (175f - 115f)).coerceIn(0f, 1f)
                      blurRadius = (1f - progress) * 85f
                      scaleFactor = 0.95f + (0.05f * progress)
                  } else {
                      // 外屏合拢阶段：0°~35° 闭合时锐利清晰，刚掀开时迅速景深失焦
                      val progress = ((angle - 5f) / (35f - 5f)).coerceIn(0f, 1f)
                      blurRadius = progress * 75f
                      scaleFactor = 1f - (0.03f * progress)
                  }

                  contentLayer.scaleX = scaleFactor
                  contentLayer.scaleY = scaleFactor

                  if (blurRadius > 1.5f) {
                      val blur = RenderEffect.createBlurEffect(blurRadius, blurRadius, Shader.TileMode.CLAMP)
                      contentLayer.setRenderEffect(blur)
                  } else {
                      contentLayer.setRenderEffect(null)
                  }
              }

              // 绘制 1:1 高仿桌面 UI（包含高质感深色组件、拟物壁纸与悬浮 Dock）
              private fun buildDesktopUI() {
                  rootContainer.removeAllViews()

                  // 渐变仿真自然风光壁纸（与视频2岩石海岸同色系）
                  val bgDrawable = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(0xFF1B3A4B.toInt(), 0xFF3D5A80.toInt(), 0xFF5C6B73.toInt(), 0xFF2F3E46.toInt())
                  )
                  rootContainer.background = bgDrawable

                  contentLayer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                      setPadding(
                          if (isUnfolded) 90 else 50,
                          130,
                          if (isUnfolded) 90 else 50,
                          80
                      )
                  }

                  // 顶部状态时间
                  val clockText = TextView(this).apply {
                      text = "8:27"
                      textSize = 15f
                      setTextColor(0xDDFFFFFF.toInt())
                      setPadding(10, 0, 0, 30)
                  }
                  contentLayer.addView(clockText)

                  // 顶部组件栏（Now brief / 天气 / 状态卡片）
                  val widgetRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val briefWidget = createWidgetCard("Now brief", "Get today's highlights", 0xFF0D2538.toInt(), 0xFF29B6F6.toInt())
                  widgetRow.addView(briefWidget)

                  val weatherWidget = createWidgetCard("91°", "Wed, 9 Sep\nSunny", 0xFF19456B.toInt(), 0xFFFFCA28.toInt())
                  widgetRow.addView(weatherWidget)

                  if (isUnfolded) {
                      val statusWidget = createWidgetCard("Status", "What's your status?", 0xFF222831.toInt(), 0xFFAB47BC.toInt())
                      widgetRow.addView(statusWidget)
                  }

                  contentLayer.addView(widgetRow)

                  // 模拟应用图标网格
                  val iconGrid = createIconGrid(if (isUnfolded) 6 else 4)
                  contentLayer.addView(iconGrid)

                  // 底部弹性空间
                  val spacer = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1.0f
                      )
                  }
                  contentLayer.addView(spacer)

                  // 底部半透明毛玻璃 Dock 栏
                  val dock = createDockBar(if (isUnfolded) 6 else 4)
                  contentLayer.addView(dock)

                  rootContainer.addView(contentLayer)
              }

              private fun createWidgetCard(title: String, subtitle: String, cardBg: Int, accentColor: Int): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          260,
                          1.0f
                      ).apply {
                          marginEnd = 24
                      }
                      setPadding(35, 35, 35, 35)

                      val shape = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 45f
                          setColor(cardBg)
                      }
                      background = shape
                  }

                  val dot = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(26, 26).apply { bottomMargin = 20 }
                      val circle = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(accentColor)
                      }
                      background = circle
                  }

                  val tView = TextView(this).apply {
                      text = title
                      textSize = 17f
                      setTextColor(0xFFFFFFFF.toInt())
                      paint.isFakeBoldText = true
                  }

                  val sView = TextView(this).apply {
                      text = subtitle
                      textSize = 12f
                      setTextColor(0xAAFFFFFF.toInt())
                      setPadding(0, 8, 0, 0)
                  }

                  card.addView(dot)
                  card.addView(tView)
                  card.addView(sView)
                  return card
              }

              private fun createIconGrid(columns: Int): View {
                  val grid = GridLayout(this).apply {
                      columnCount = columns
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          topMargin = 60
                      }
                  }

                  val appColors = intArrayOf(
                      0xFFE53935.toInt(), 0xFF1E88E5.toInt(), 0xFF43A047.toInt(), 0xFFFB8C00.toInt(),
                      0xFF8E24AA.toInt(), 0xFF00ACC1.toInt(), 0xFFF4511E.toInt(), 0xFF3949AB.toInt(),
                      0xFF7CB342.toInt(), 0xFFD81B60.toInt(), 0xFF039BE5.toInt(), 0xFF00897B.toInt()
                  )

                  val totalIcons = if (isUnfolded) 12 else 8
                  for (i in 0 until totalIcons) {
                      val iconItem = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              bottomMargin = 45
                          }
                      }

                      val squircle = View(this).apply {
                          layoutParams = LinearLayout.LayoutParams(130, 130)
                          val shape = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              cornerRadius = 38f
                              setColor(appColors[i % appColors.size])
                          }
                          background = shape
                      }

                      val label = TextView(this).apply {
                          text = "App ${i + 1}"
                          textSize = 12f
                          setTextColor(0xEEFFFFFF.toInt())
                          setPadding(0, 10, 0, 0)
                      }

                      iconItem.addView(squircle)
                      iconItem.addView(label)
                      grid.addView(iconItem)
                  }
                  return grid
              }

              private fun createDockBar(count: Int): View {
                  val dockWrap = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          if (isUnfolded) 800 else LinearLayout.LayoutParams.MATCH_PARENT,
                          180
                      )
                      setPadding(40, 0, 40, 0)

                      val shape = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 90f
                          setColor(0x44FFFFFF.toInt())
                      }
                      background = shape
                  }

                  val dockColors = intArrayOf(0xFF4CAF50.toInt(), 0xFF2196F3.toInt(), 0xFFFF9800.toInt(), 0xFFE91E63.toInt(), 0xFF9C27B0.toInt(), 0xFF00BCD4.toInt())
                  for (i in 0 until count) {
                      val icon = View(this).apply {
                          layoutParams = LinearLayout.LayoutParams(110, 110).apply {
                              leftMargin = 20
                              rightMargin = 20
                          }
                          val shape = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              cornerRadius = 35f
                              setColor(dockColors[i % dockColors.size])
                          }
                          background = shape
                      }
                      dock.addView(icon)
                  }

                  dockWrap.addView(dock)
                  return dockWrap
              }
          }
          EOF

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldAnimation-Debug
          path: app/build/outputs/apk/debug/*.apk
