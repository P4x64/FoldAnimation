name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Custom Fold Launcher
        run: |
          mkdir -p app/src/main/java/com/example/foldlauncher

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldlauncher"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 7
                  versionName = "5.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fold 8 Launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:resizeableActivity="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldlauncher/LauncherActivity.kt
          package com.example.foldlauncher

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.RenderEffect
          import android.graphics.Shader
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          data class InstalledApp(val name: String, val icon: Drawable, val pkgName: String)

          class LauncherActivity : Activity(), SensorEventListener {

              private lateinit var sensorManager: SensorManager
              private var hingeSensor: Sensor? = null
              private lateinit var rootContainer: FrameLayout

              private var leftPanel: LinearLayout? = null
              private var rightPanel: LinearLayout? = null
              private var outerContainer: LinearLayout? = null

              private val appList = mutableListOf<InstalledApp>()
              private var isUnfolded = false
              private var currentAngle = 180f

              private fun dp(v: Float): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemUI()

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hingeSensor = sensorManager.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)

                  rootContainer = FrameLayout(this)
                  setContentView(rootContainer)

                  loadRealApps()
                  checkScreenState(resources.configuration)
                  buildDesktop()
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemUI()
                  hingeSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  hideSystemUI()
                  checkScreenState(newConfig)
                  buildDesktop()
                  applyPhysicBlur(currentAngle)
              }

              private fun checkScreenState(config: Configuration) {
                  isUnfolded = config.smallestScreenWidthDp >= 600
              }

              private fun hideSystemUI() {
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_FULLSCREEN
                                  or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          )
              }

              // 读取手机已安装的所有真实 App
              private fun loadRealApps() {
                  appList.clear()
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val resolved: List<ResolveInfo> = pm.queryIntentActivities(mainIntent, 0)
                  for (info in resolved) {
                      if (info.activityInfo.packageName == packageName) continue
                      val label = info.loadLabel(pm).toString()
                      val icon = info.loadIcon(pm)
                      appList.add(InstalledApp(label, icon, info.activityInfo.packageName))
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  event?.let {
                      currentAngle = it.values[0]
                      applyPhysicBlur(currentAngle)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              // 像素级复刻视频 2：物理开合非对称对焦引擎
              private fun applyPhysicBlur(angle: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return

                  if (isUnfolded) {
                      // 内屏模式：左半扇面在 110°~175° 从大景深失焦平滑合焦，右侧锚点保持清晰
                      val progress = ((angle - 110f) / (175f - 110f)).coerceIn(0f, 1f)
                      val blurRadius = (1f - progress) * 85f

                      leftPanel?.let { panel ->
                          panel.alpha = 0.65f + (0.35f * progress)
                          panel.scaleX = 0.94f + (0.06f * progress)
                          panel.scaleY = 0.94f + (0.06f * progress)
                          panel.translationX = (1f - progress) * -dp(30f)

                          if (blurRadius > 1.5f) {
                              panel.setRenderEffect(RenderEffect.createBlurEffect(blurRadius, blurRadius, Shader.TileMode.CLAMP))
                          } else {
                              panel.setRenderEffect(null)
                          }
                      }
                      rightPanel?.setRenderEffect(null)
                  } else {
                      // 外屏模式：折叠中动态失焦，合紧到 0° 时瞬间锐利合焦
                      val progress = ((angle - 3f) / (35f - 3f)).coerceIn(0f, 1f)
                      val blurRadius = progress * 75f

                      outerContainer?.let { container ->
                          if (blurRadius > 1.5f) {
                              container.setRenderEffect(RenderEffect.createBlurEffect(blurRadius, blurRadius, Shader.TileMode.CLAMP))
                          } else {
                              container.setRenderEffect(null)
                          }
                      }
                  }
              }

              private fun buildDesktop() {
                  rootContainer.removeAllViews()

                  // 1. 壁纸层：直接获取你手机当前设置的系统壁纸
                  val wallpaperView = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      try {
                          val wm = WallpaperManager.getInstance(this@LauncherActivity)
                          setImageDrawable(wm.drawable)
                      } catch (e: Exception) {
                          setBackgroundColor(0xFF1E222A.toInt())
                      }
                  }
                  rootContainer.addView(wallpaperView)

                  // 2. 桌面内容层
                  if (isUnfolded) {
                      buildInnerDesktop()
                  } else {
                      buildOuterDesktop()
                  }

                  // 3. 顶部微型状态时间
                  addStatusBarClock()
              }

              // 内屏：非对称双屏结构（左侧你的应用与主卡片，右侧微型快捷卡片）
              private fun buildInnerDesktop() {
                  val mainBox = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(20f), dp(40f), dp(20f), dp(85f))
                  }

                  // === 左扇面（承载你的应用网格与动态虚化） ===
                  leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply {
                          marginEnd = dp(15f)
                      }

                      // 顶部精致小组件排（视频2同款比例）
                      val widgetRow = LinearLayout(this@LauncherActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createDateWidget())
                      }
                      addView(widgetRow)

                      // 承载你真实 App 的滚动网格
                      val scroll = ScrollView(this@LauncherActivity).apply {
                          isVerticalScrollBarEnabled = false
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f).apply {
                              topMargin = dp(15f)
                          }
                      }
                      scroll.addView(createAppGrid(4, 16))
                      addView(scroll)
                  }

                  // === 右侧锚点（保持清晰，可展示天气与系统状态卡片） ===
                  rightPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply {
                          marginStart = dp(15f)
                      }

                      val statusRow = LinearLayout(this@LauncherActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createStatusWidget())
                      }
                      addView(statusRow)

                      // 右侧剩余区域留空展示壁纸主体
                      addView(View(this@LauncherActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f)
                      })
                  }

                  mainBox.addView(leftPanel)
                  mainBox.addView(rightPanel)
                  rootContainer.addView(mainBox)

                  // 底部毛玻璃 Dock（装载你的常用 App）
                  val dockWrap = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                          bottomMargin = dp(18f)
                      }
                  }
                  dockWrap.addView(createDockBar(6))
                  rootContainer.addView(dockWrap)
              }

              // 外屏：单列紧凑桌面
              private fun buildOuterDesktop() {
                  outerContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(16f), dp(40f), dp(16f), dp(20f))

                      val widgetRow = LinearLayout(this@LauncherActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createDateWidget())
                      }
                      addView(widgetRow)

                      val scroll = ScrollView(this@LauncherActivity).apply {
                          isVerticalScrollBarEnabled = false
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f).apply {
                              topMargin = dp(15f)
                          }
                      }
                      scroll.addView(createAppGrid(4, 12))
                      addView(scroll)

                      addView(createDockBar(4))
                  }
                  rootContainer.addView(outerContainer)
              }

              // 生成应用网格（显示真实图标与名称，点击可打开）
              private fun createAppGrid(cols: Int, maxCount: Int): View {
                  val grid = GridLayout(this).apply {
                      columnCount = cols
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  }

                  val displayList = appList.take(maxCount)
                  for (app in displayList) {
                      val item = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              bottomMargin = dp(18f)
                          }
                          setOnClickListener {
                              val launchIntent = packageManager.getLaunchIntentForPackage(app.pkgName)
                              launchIntent?.let { startActivity(it) }
                          }
                      }

                      val iconView = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(54f), dp(54f))
                          setImageDrawable(app.icon)
                      }

                      val labelView = TextView(this).apply {
                          text = app.name
                          textSize = 11f
                          setTextColor(0xEEFFFFFF.toInt())
                          maxLines = 1
                          setPadding(0, dp(4f), 0, 0)
                      }

                      item.addView(iconView)
                      item.addView(labelView)
                      grid.addView(item)
                  }
                  return grid
              }

              private fun createDockBar(count: Int): View {
                  val dockWrap = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          if (isUnfolded) dp(320f) else LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(68f)
                      )
                      background = GradientDrawable().apply {
                          cornerRadius = dp(34f).toFloat()
                          setColor(0x40FFFFFF.toInt())
                      }
                  }

                  val dockApps = appList.take(count)
                  for (app in dockApps) {
                      val img = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(48f), dp(48f)).apply {
                              leftMargin = dp(8f)
                              rightMargin = dp(8f)
                          }
                          setImageDrawable(app.icon)
                          setOnClickListener {
                              val launchIntent = packageManager.getLaunchIntentForPackage(app.pkgName)
                              launchIntent?.let { startActivity(it) }
                          }
                      }
                      dockWrap.addView(img)
                  }
                  return dockWrap
              }

              // 视频2同款精致卡片 1：Now brief（带青色胶囊竖条）
              private fun createBriefWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply {
                          marginEnd = dp(8f)
                      }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(24f).toFloat()
                          setColor(0xCC102434.toInt())
                      }
                  }
                  val bar = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(6f), dp(14f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply {
                          cornerRadius = dp(3f).toFloat()
                          setColor(0xFF00E5FF.toInt())
                      }
                  }
                  val title = TextView(this).apply {
                      text = "Now brief"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      paint.isFakeBoldText = true
                  }
                  val sub = TextView(this).apply {
                      text = "Get today's highlights"
                      textSize = 11f
                      setTextColor(0x99FFFFFF.toInt())
                  }
                  card.addView(bar)
                  card.addView(title)
                  card.addView(sub)
                  return card
              }

              // 视频2同款精致卡片 2：日期/电量（带黄色太阳圆点）
              private fun createDateWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply {
                          marginStart = dp(8f)
                      }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(24f).toFloat()
                          setColor(0xCC163B5C.toInt())
                      }
                  }
                  val dot = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(10f), dp(10f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xFFFFCA28.toInt())
                      }
                  }
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val battery = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val t = TextView(this).apply {
                      text = "$battery%"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      paint.isFakeBoldText = true
                  }
                  val dateStr = SimpleDateFormat("EEE, d MMM", Locale.ENGLISH).format(Date())
                  val s = TextView(this).apply {
                      text = dateStr
                      textSize = 11f
                      setTextColor(0xAAFFFFFF.toInt())
                  }
                  card.addView(dot)
                  card.addView(t)
                  card.addView(s)
                  return card
              }

              // 视频2同款精致卡片 3：Status 卡片
              private fun createStatusWidget(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f)
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(24f).toFloat()
                          setColor(0xCC1E242C.toInt())
                      }
                  }
                  val dot = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(10f), dp(10f)).apply { bottomMargin = dp(8f) }
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xFFBA68C8.toInt())
                      }
                  }
                  val t = TextView(this).apply {
                      text = "Status"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      paint.isFakeBoldText = true
                  }
                  val s = TextView(this).apply {
                      text = "All systems normal"
                      textSize = 11f
                      setTextColor(0x99FFFFFF.toInt())
                  }
                  card.addView(dot)
                  card.addView(t)
                  card.addView(s)
                  return card
              }

              private fun addStatusBarClock() {
                  val timeStr = SimpleDateFormat("H:mm", Locale.getDefault()).format(Date())
                  val tv = TextView(this).apply {
                      text = timeStr
                      textSize = 13f
                      setTextColor(0xCCFFFFFF.toInt())
                      paint.isFakeBoldText = true
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(14f)
                          leftMargin = dp(24f)
                      }
                  }
                  rootContainer.addView(tv)
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fold8-MyDesktop-APK
          path: app/build/outputs/apk/debug/*.apk
