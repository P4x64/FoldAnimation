name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate True Optical Cinema Engine
        run: |
          mkdir -p app/src/main/java/com/example/foldanimation

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldAnimation"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.foldanimation"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldanimation"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 15
                  versionName = "10.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Fold 8"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:resizeableActivity="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/foldanimation/MainActivity.kt
          package com.example.foldanimation

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.Context
          import android.content.pm.ResolveInfo
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.view.Choreographer
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.abs

          data class RealApp(val name: String, val icon: Drawable, val pkg: String)

          class MainActivity : Activity(), SensorEventListener, Choreographer.FrameCallback {

              private lateinit var sm: SensorManager
              private var hinge: Sensor? = null
              private var wakeLock: PowerManager.WakeLock? = null

              private lateinit var rootFrame: FrameLayout
              private lateinit var wholeSceneLayer: FrameLayout // 核心：整屏全景统一光影视效层
              private var dockWrap: View? = null

              private val apps = mutableListOf<RealApp>()
              private var isUnfolded = false

              // 120Hz 光学阻尼参数
              private var targetAngle = 180f
              private var smoothAngle = 180f
              private var lastBlur = -1f

              private fun dp(v: Float): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setupAntiSleepAndImmersive()

                  sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  hinge = sm.getDefaultSensor(Sensor.TYPE_HINGE_ANGLE)

                  rootFrame = FrameLayout(this)
                  setContentView(rootFrame)

                  loadRealApps()
                  checkScreenState(resources.configuration)
                  rebuildScene()
              }

              override fun onResume() {
                  super.onResume()
                  setupAntiSleepAndImmersive()
                  hinge?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST) }
                  Choreographer.getInstance().postFrameCallback(this)
              }

              override fun onPause() {
                  super.onPause()
                  sm.unregisterListener(this)
                  Choreographer.getInstance().removeFrameCallback(this)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  wakeLock?.let { if (it.isHeld) it.release() }
              }

              // 屏幕折叠翻转热切换（零重新加载，画面不断连）
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  setupAntiSleepAndImmersive()
                  checkScreenState(newConfig)
                  rebuildScene()
                  lastBlur = -1f
              }

              private fun checkScreenState(c: Configuration) {
                  isUnfolded = c.smallestScreenWidthDp >= 600
              }

              // 强力禁止内外屏休眠与断电锁屏
              private fun setupAntiSleepAndImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }
                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_FULLSCREEN
                                  or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          )

                  if (wakeLock == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP, "FoldAnimation::DualAwake")
                      wakeLock?.acquire(10 * 60 * 1000L)
                  }
              }

              private fun loadRealApps() {
                  apps.clear()
                  val pm = packageManager
                  val intent = android.content.Intent(android.content.Intent.ACTION_MAIN, null).apply {
                      addCategory(android.content.Intent.CATEGORY_LAUNCHER)
                  }
                  val list: List<ResolveInfo> = pm.queryIntentActivities(intent, 0)
                  for (i in list) {
                      if (i.activityInfo.packageName == packageName) continue
                      apps.add(RealApp(i.loadLabel(pm).toString(), i.loadIcon(pm), i.activityInfo.packageName))
                  }
              }

              override fun onSensorChanged(e: SensorEvent?) {
                  e?.let { targetAngle = it.values[0] }
              }

              override fun onAccuracyChanged(s: Sensor?, a: Int) {}

              // 120Hz 逐帧物理平滑驱动
              override fun doFrame(frameTimeNanos: Long) {
                  val lerp = 0.22f
                  smoothAngle += (targetAngle - smoothAngle) * lerp
                  applyTrueCinemaFocus(smoothAngle)
                  Choreographer.getInstance().postFrameCallback(this)
              }

              // 视频 2 真实复刻：全景大光圈拉焦与合焦算法
              private fun applyTrueCinemaFocus(angle: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return

                  val focusFactor: Float
                  val blurRadius: Float

                  if (isUnfolded) {
                      // 【内屏开合】：110° 到 176° 进行全屏拉焦；176°~180° 瞬间合焦
                      val rawP = ((angle - 110f) / (175f - 110f)).coerceIn(0f, 1f)
                      focusFactor = rawP * rawP * (3f - 2f * rawP) // 三次 Hermite 镜头光学拉焦
                      blurRadius = if (angle >= 174f) 0f else (1f - focusFactor) * 85f

                      wholeSceneLayer.pivotX = wholeSceneLayer.width * 0.5f
                      wholeSceneLayer.pivotY = wholeSceneLayer.height * 0.5f
                      wholeSceneLayer.scaleX = 0.94f + (0.06f * focusFactor)
                      wholeSceneLayer.scaleY = 0.94f + (0.06f * focusFactor)
                      wholeSceneLayer.alpha = 0.75f + (0.25f * focusFactor)
                  } else {
                      // 【外屏合盖】：开屏时（0°~45°）失焦扩散；扣紧到 0° 时瞬间锐利合焦
                      val rawP = ((angle - 3f) / (40f - 3f)).coerceIn(0f, 1f)
                      val defocusFactor = rawP * rawP * (3f - 2f * rawP)
                      blurRadius = if (angle <= 2.5f) 0f else defocusFactor * 80f
                      focusFactor = 1f - defocusFactor

                      wholeSceneLayer.scaleX = 0.95f + (0.05f * focusFactor)
                      wholeSceneLayer.scaleY = 0.95f + (0.05f * focusFactor)
                      wholeSceneLayer.alpha = 0.80f + (0.20f * focusFactor)
                  }

                  if (abs(blurRadius - lastBlur) > 0.8f) {
                      lastBlur = blurRadius
                      if (blurRadius > 1.2f) {
                          wholeSceneLayer.setRenderEffect(RenderEffect.createBlurEffect(blurRadius, blurRadius, Shader.TileMode.CLAMP))
                      } else {
                          wholeSceneLayer.setRenderEffect(null)
                      }
                  }
              }

              private fun rebuildScene() {
                  rootFrame.removeAllViews()

                  // 创建整屏光学载体（壁纸 + 组件 + 图标全在这一个图层里，整体对焦）
                  wholeSceneLayer = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }

                  // 1. 底层壁纸（读取本机壁纸）
                  val bg = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      try {
                          setImageDrawable(WallpaperManager.getInstance(this@MainActivity).drawable)
                      } catch (e: Exception) {
                          setBackgroundColor(0xFF1B2A38.toInt())
                      }
                  }
                  wholeSceneLayer.addView(bg)

                  // 2. 桌面内容布局
                  if (isUnfolded) {
                      buildInnerScene()
                  } else {
                      buildOuterScene()
                  }

                  rootFrame.addView(wholeSceneLayer)

                  // 3. 顶部物理状态栏
                  addRealStatusBar()
              }

              // 内屏：双列全景构图
              private fun buildInnerScene() {
                  val hBox = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(24f), dp(44f), dp(24f), dp(85f))
                  }

                  // 左半扇面（Now brief + 天气 + 应用网格）
                  val leftCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply { marginEnd = dp(16f) }
                      val topW = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createWeatherWidget())
                      }
                      addView(topW)
                      addView(createGrid(4, 0, 8))
                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                  }

                  // 右半扇面（Status 卡片 + 其余应用）
                  val rightCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.0f).apply { marginStart = dp(16f) }
                      val topR = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          val folder = LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.HORIZONTAL
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f)
                              if (apps.size > 8) addView(createAppItem(apps[8]))
                              if (apps.size > 9) addView(createAppItem(apps[9]))
                          }
                          addView(folder)
                          addView(createStatusWidget())
                      }
                      addView(topR)
                      if (apps.size > 10) addView(createGrid(4, 10, 8))
                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                  }

                  hBox.addView(leftCol)
                  hBox.addView(rightCol)
                  wholeSceneLayer.addView(hBox)

                  // 底部中央 Dock
                  val dockFrame = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                          bottomMargin = dp(18f)
                      }
                  }
                  dockWrap = createDock(6)
                  dockFrame.addView(dockWrap)
                  wholeSceneLayer.addView(dockFrame)
              }

              // 外屏：单列紧凑构图
              private fun buildOuterScene() {
                  val vBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                      setPadding(dp(18f), dp(44f), dp(18f), dp(20f))

                      val topW = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          addView(createBriefWidget())
                          addView(createWeatherWidget())
                      }
                      addView(topW)
                      addView(createGrid(4, 0, 8))
                      addView(View(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f) })
                      addView(createDock(4))
                  }
                  wholeSceneLayer.addView(vBox)
              }

              private fun createBriefWidget(): View {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginEnd = dp(6f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC102434.toInt()) }
                      val bar = View(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(5f), dp(14f)).apply { bottomMargin = dp(6f) }
                          background = GradientDrawable().apply { cornerRadius = dp(2.5f).toFloat(); setColor(0xFF00E5FF.toInt()) }
                      }
                      val t = TextView(this@MainActivity).apply { text = "Now brief"; textSize = 15f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                      val s = TextView(this@MainActivity).apply { text = "Get today's highlights"; textSize = 11f; setTextColor(0x99FFFFFF.toInt()) }
                      addView(bar); addView(t); addView(s)
                  }
              }

              private fun createWeatherWidget(): View {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginStart = dp(6f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC163B5C.toInt()) }
                      val dot = View(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(8f), dp(8f)).apply { bottomMargin = dp(6f) }
                          background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFFFFCA28.toInt()) }
                      }
                      val t = TextView(this@MainActivity).apply { text = "91°"; textSize = 17f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                      val s = TextView(this@MainActivity).apply { text = "Wed, 9 Sep\nSunny"; textSize = 11f; setTextColor(0xAAFFFFFF.toInt()) }
                      addView(dot); addView(t); addView(s)
                  }
              }

              private fun createStatusWidget(): View {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(100f), 1.0f).apply { marginStart = dp(8f) }
                      setPadding(dp(14f), dp(14f), dp(14f), dp(14f))
                      background = GradientDrawable().apply { cornerRadius = dp(22f).toFloat(); setColor(0xCC1E242C.toInt()) }
                      val dot = View(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(8f), dp(8f)).apply { bottomMargin = dp(6f) }
                          background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFFBA68C8.toInt()) }
                      }
                      val t = TextView(this@MainActivity).apply { text = "Status"; textSize = 15f; setTextColor(Color.WHITE); paint.isFakeBoldText = true }
                      val s = TextView(this@MainActivity).apply { text = "What's your status?"; textSize = 11f; setTextColor(0x99FFFFFF.toInt()) }
                      addView(dot); addView(t); addView(s)
                  }
              }

              private fun createGrid(cols: Int, start: Int, count: Int): View {
                  val g = GridLayout(this).apply {
                      columnCount = cols
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(18f) }
                  }
                  val end = minOf(start + count, apps.size)
                  for (i in start until end) {
                      val v = createAppItem(apps[i])
                      v.layoutParams = GridLayout.LayoutParams().apply { width = 0; columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f); bottomMargin = dp(16f) }
                      g.addView(v)
                  }
                  return g
              }

              private fun createAppItem(app: RealApp): View {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setOnClickListener {
                          animate().scaleX(0.88f).scaleY(0.88f).setDuration(80).withEndAction {
                              animate().scaleX(1.0f).scaleY(1.0f).setDuration(100).start()
                              packageManager.getLaunchIntentForPackage(app.pkg)?.let { startActivity(it) }
                          }.start()
                      }
                      val img = ImageView(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(54f), dp(54f))
                          setImageDrawable(app.icon)
                      }
                      val tv = TextView(this@MainActivity).apply {
                          text = app.name
                          textSize = 11f
                          setTextColor(0xEEFFFFFF.toInt())
                          maxLines = 1
                          setPadding(0, dp(4f), 0, 0)
                      }
                      addView(img); addView(tv)
                  }
              }

              private fun createDock(count: Int): View {
                  val dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(if (isUnfolded) dp(330f) else LinearLayout.LayoutParams.MATCH_PARENT, dp(68f))
                      background = GradientDrawable().apply { cornerRadius = dp(34f).toFloat(); setColor(0x40FFFFFF.toInt()) }
                  }
                  val dockApps = apps.take(count)
                  for (app in dockApps) {
                      val icon = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(dp(48f), dp(48f)).apply { leftMargin = dp(7f); rightMargin = dp(7f) }
                          setImageDrawable(app.icon)
                          setOnClickListener { packageManager.getLaunchIntentForPackage(app.pkg)?.let { startActivity(it) } }
                      }
                      dock.addView(icon)
                  }
                  return dock
              }

              private fun addRealStatusBar() {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(12f); leftMargin = dp(24f); rightMargin = dp(24f)
                      }
                  }
                  val timeTv = TextView(this).apply {
                      text = SimpleDateFormat("H:mm", Locale.getDefault()).format(Date())
                      textSize = 13f; setTextColor(0xDDFFFFFF.toInt()); paint.isFakeBoldText = true
                  }
                  val spacer = View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1.0f) }
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val rightInfo = TextView(this).apply {
                      text = "5G  $bat%"; textSize = 13f; setTextColor(0xDDFFFFFF.toInt()); paint.isFakeBoldText = true
                  }
                  bar.addView(timeTv); bar.addView(spacer); bar.addView(rightInfo)
                  rootFrame.addView(bar)
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found!" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fold8-CinemaFocus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
